<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f5f9;
            color: #333;
        }

        header {
            background: #243b55;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #243b55;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #243b55;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background: #243b55;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #141e30;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #243b55;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #243b55;
            color: white;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Result Management System</h1>
    <p>Mini Project using HTML, CSS & JavaScript</p>
</header>

<div class="container">

    <!-- Add Student Form -->
    <div class="card">
        <h2>Add Student Result</h2>

        <form id="resultForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="studentName"
                           placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="rollNumber"
                           placeholder="Enter roll number" required>
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <input type="text" id="studentClass"
                           placeholder="Enter class" required>
                </div>

                <div class="form-group">
                    <label>English</label>
                    <input type="number" id="english"
                           min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Mathematics</label>
                    <input type="number" id="maths"
                           min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Science</label>
                    <input type="number" id="science"
                           min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Social Science</label>
                    <input type="number" id="social"
                           min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Computer</label>
                    <input type="number" id="computer"
                           min="0" max="100" required>
                </div>

            </div>

            <button type="submit" class="btn">
                Add Result
            </button>

        </form>
    </div>


    <!-- Student Records -->
    <div class="card">

        <h2>Student Results</h2>

        <div class="search-box">
            <input type="text"
                   id="search"
                   placeholder="Search by student name or roll number..."
                   onkeyup="searchStudents()">
        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Class</th>
                        <th>English</th>
                        <th>Maths</th>
                        <th>Science</th>
                        <th>Social</th>
                        <th>Computer</th>
                        <th>Total</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="resultTable">
                </tbody>

            </table>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 Student Result Management System</p>
</footer>


<script>

    // Load existing records
    let students = JSON.parse(localStorage.getItem("students")) || [];

    // Form submit
    document.getElementById("resultForm").addEventListener("submit", function(e) {

        e.preventDefault();

        let name = document.getElementById("studentName").value;
        let roll = document.getElementById("rollNumber").value;
        let studentClass = document.getElementById("studentClass").value;

        let english = Number(document.getElementById("english").value);
        let maths = Number(document.getElementById("maths").value);
        let science = Number(document.getElementById("science").value);
        let social = Number(document.getElementById("social").value);
        let computer = Number(document.getElementById("computer").value);

        // Calculate total
        let total = english + maths + science + social + computer;

        // Calculate percentage
        let percentage = total / 5;

        // Calculate grade
        let grade;

        if (percentage >= 90) {
            grade = "A+";
        }
        else if (percentage >= 80) {
            grade = "A";
        }
        else if (percentage >= 70) {
            grade = "B";
        }
        else if (percentage >= 60) {
            grade = "C";
        }
        else if (percentage >= 50) {
            grade = "D";
        }
        else {
            grade = "F";
        }

        // Student must score at least 35 in every subject
        let passed =
            english >= 35 &&
            maths >= 35 &&
            science >= 35 &&
            social >= 35 &&
            computer >= 35;

        let status = passed ? "Pass" : "Fail";

        // Create student object
        let student = {
            name: name,
            roll: roll,
            studentClass: studentClass,
            english: english,
            maths: maths,
            science: science,
            social: social,
            computer: computer,
            total: total,
            percentage: percentage.toFixed(2),
            grade: grade,
            status: status
        };

        students.push(student);

        // Save to localStorage
        localStorage.setItem("students", JSON.stringify(students));

        // Clear form
        document.getElementById("resultForm").reset();

        displayStudents();

        alert("Student result added successfully!");

    });


    // Display students
    function displayStudents(data = students) {

        let table = document.getElementById("resultTable");

        table.innerHTML = "";

        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="13" class="empty">
                        No student records found
                    </td>
                </tr>
            `;

            return;
        }

        data.forEach((student, index) => {

            let row = document.createElement("tr");

            row.innerHTML = `
                <td>${student.name}</td>
                <td>${student.roll}</td>
                <td>${student.studentClass}</td>
                <td>${student.english}</td>
                <td>${student.maths}</td>
                <td>${student.science}</td>
                <td>${student.social}</td>
                <td>${student.computer}</td>
                <td>${student.total}/500</td>
                <td>${student.percentage}%</td>
                <td>${student.grade}</td>

                <td class="${student.status === 'Pass' ? 'pass' : 'fail'}">
                    ${student.status}
                </td>

                <td>
                    <button class="delete-btn"
                            onclick="deleteStudent(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);

        });

    }


    // Delete student
    function deleteStudent(index) {

        if (confirm("Are you sure you want to delete this result?")) {

            students.splice(index, 1);

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            displayStudents();
        }

    }


    // Search students
    function searchStudents() {

        let searchValue =
            document.getElementById("search")
            .value
            .toLowerCase();

        let filteredStudents = students.filter(student =>

            student.name.toLowerCase().includes(searchValue) ||
            student.roll.toLowerCase().includes(searchValue)

        );

        displayStudents(filteredStudents);

    }


    // Display records when page loads
    displayStudents();

</script>

</body>
</html>
